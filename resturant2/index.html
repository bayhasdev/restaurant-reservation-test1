<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>الأربع نواعير | مطعم ومقهى</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body class="bg-stone-50 text-gray-800">

    <!-- Mobile Header -->
    <header class="lg:hidden fixed top-0 right-0 left-0 z-50 bg-white border-b border-gray-200">
        <div class="h-16 px-4 flex items-center justify-between">

            <button
                id="open-sidebar"
                type="button"
                class="w-10 h-10 flex items-center justify-center rounded-xl bg-gray-100"
                aria-label="فتح القائمة"
            >
                <i class="fa-solid fa-bars"></i>
            </button>

            <div class="text-center">
                <h1 class="font-bold text-lg text-gray-900">
                    الأربع نواعير
                </h1>

                <p class="text-xs text-gray-500">
                    مطعم ومقهى
                </p>
            </div>

            <a
                href="booking.html"
                class="w-10 h-10 flex items-center justify-center rounded-xl bg-amber-100 text-amber-700"
                aria-label="حجز طاولة"
            >
                <i class="fa-solid fa-calendar-check"></i>
            </a>

        </div>
    </header>


    <!-- Overlay -->
    <div
        id="sidebar-overlay"
        class="fixed inset-0 bg-black/50 z-40 hidden lg:hidden"
    ></div>


    <!-- Sidebar -->
    <aside
        id="sidebar"
        class="fixed top-0 right-0 bottom-0 z-50 w-72 bg-white border-l border-gray-200 transform translate-x-full lg:translate-x-0 transition-transform duration-300 flex flex-col"
    >

        <!-- Sidebar Header -->
        <div class="p-6 border-b border-gray-200">

            <div class="flex items-center justify-between">

                <div>
                    <h1 class="text-2xl font-black text-gray-900">
                        الأربع نواعير
                    </h1>

                    <p class="text-sm text-gray-500 mt-1">
                        مطعم ومقهى
                    </p>
                </div>

                <button
                    id="close-sidebar"
                    type="button"
                    class="lg:hidden w-10 h-10 rounded-xl bg-gray-100"
                    aria-label="إغلاق القائمة"
                >
                    <i class="fa-solid fa-xmark"></i>
                </button>

            </div>

        </div>


        <!-- Navigation -->
        <nav class="flex-1 px-4 py-6 overflow-y-auto">

            <!-- Table Booking -->
            <a
                href="booking.html"
                class="flex items-center gap-3 w-full px-4 py-3 mb-6 rounded-xl bg-gray-900 text-white hover:bg-gray-800 transition"
            >
                <i class="fa-solid fa-calendar-check w-5 text-center"></i>
                <span class="font-semibold">حجز طاولة</span>
            </a>
        
           
        
            <!-- Main Categories -->
            <div class="mt-8">
        
                <div class="space-y-2">
        
                    <button
                        type="button"
                        class="sidebar-category"
                        data-category-id="1"
                    >
                        <i class="fa-solid fa-egg w-5 text-center"></i>
                        <span>فطور</span>
                    </button>
        
                    <button
                        type="button"
                        class="sidebar-category"
                        data-category-id="2"
                    >
                        <i class="fa-solid fa-bowl-food w-5 text-center"></i>
                        <span>غداء</span>
                    </button>
        
                    <button
                        type="button"
                        class="sidebar-category"
                        data-category-id="3"
                    >
                        <i class="fa-solid fa-drumstick-bite w-5 text-center"></i>
                        <span>مشاوي</span>
                    </button>
        
                    <button
                        type="button"
                        class="sidebar-category"
                        data-category-id="4"
                    >
                        <i class="fa-solid fa-fire w-5 text-center"></i>
                        <span>أركيلة</span>
                    </button>
        
                    <button
                        type="button"
                        class="sidebar-category"
                        data-category-id="5"
                    >
                        <i class="fa-solid fa-mug-hot w-5 text-center"></i>
                        <span>مشروبات</span>
                    </button>
        
                </div>
        
            </div>
        
        </nav>


        <!-- Social Links -->
        <div class="p-5 border-t border-gray-200">

            <p class="text-xs text-gray-500 text-center mb-4">
                تابعنا على
            </p>

            <div class="flex items-center justify-center gap-3">

                <a
                    href="#"
                    class="social-link"
                    aria-label="WhatsApp"
                >
                    <i class="fa-brands fa-whatsapp"></i>
                </a>

                <a
                    href="#"
                    class="social-link"
                    aria-label="Facebook"
                >
                    <i class="fa-brands fa-facebook-f"></i>
                </a>

                <a
                    href="#"
                    class="social-link"
                    aria-label="Instagram"
                >
                    <i class="fa-brands fa-instagram"></i>
                </a>

            </div>

        </div>

    </aside>


    <!-- Main Content -->
    <main class="lg:mr-72 min-h-screen">

        <!-- Menu Component -->
        <div id="menu-container" class="pt-16 lg:pt-0">
            <div class="min-h-screen flex items-center justify-center">
                <div class="text-center">

                    <div class="animate-spin text-amber-600 text-3xl mb-4">
                        <i class="fa-solid fa-spinner"></i>
                    </div>

                    <p class="text-gray-500">
                        جاري تحميل القائمة...
                    </p>

                </div>
            </div>
        </div>

    </main>


    <!-- Product Modal -->
    <div
        id="meal-modal"
        class="fixed inset-0 z-[100] hidden"
    >

        <div
            class="absolute inset-0 bg-black/60"
            data-close-modal
        ></div>

        <div class="relative min-h-screen flex items-center justify-center p-4">

            <div
                id="meal-modal-content"
                class="bg-white rounded-3xl overflow-hidden shadow-2xl w-full max-w-lg max-h-[90vh] overflow-y-auto"
            >

                <!-- Content injected by JavaScript -->

            </div>

        </div>

    </div>


    <!-- Data -->
    <script src="assets/js/data.js"></script>

    <!-- Menu Logic -->
    <script src="assets/js/menu.js"></script>

    <!-- Application Logic -->
    <script src="assets/js/app.js"></script>

</body>
</html>
